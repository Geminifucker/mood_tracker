<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- 모바일에서 화면 크기에 맞게 보이게 하는 필수 태그 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 홈 화면에 추가했을 때 주소창 없이 앱처럼 뜨게 함 -->
<!-- 아래가 현재 표준 이름. 그 밑의 apple- 버전은 구형 iOS 호환용으로 남겨둠 -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#16171B">
<!-- "이 페이지는 이미 어두운 테마다"라고 브라우저에 알려주는 표시.
     이게 없으면 브라우저가 알아서 색을 뒤집어버리는 경우가 있어요. -->
<meta name="color-scheme" content="dark">

<!-- 홈 화면 아이콘 설정 -->
<!-- 안드로이드/크롬은 manifest.json을 봅니다 -->
<link rel="manifest" href="manifest.json">
<!-- 아이폰은 manifest를 잘 안 보므로 이 태그를 따로 봐야 해요 -->
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>오늘 기분</title>

<style>
/* ===== 1) 색/치수를 변수로 한 곳에 모아두기 =====
   이렇게 해두면 색 바꿀 때 여기만 고치면 돼요. */
:root {
  color-scheme: dark;   /* CSS쪽에서도 같은 선언 (둘 다 해두는 게 안전) */

  --bg:      #16171B;   /* 배경 (밤에 보기 편한 어두운 톤) */
  --surface: #1E2026;   /* 카드 배경 */
  --line:    #2C2F36;   /* 경계선 */
  --text:    #ECEAE4;   /* 본문 글자 */
  --muted:   #868A93;   /* 흐린 글자 */

  /* 기분 1~5단계 색. 나쁨=차갑고 어둡게, 좋음=따뜻하고 밝게 */
  --m1: #3D4457;
  --m2: #4E6E82;
  --m3: #6F9080;
  --m4: #A8A45E;
  --m5: #D9A94A;
}

/* 모든 요소의 크기 계산을 테두리 포함으로 (box-model 복습!) */
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 24px 20px 40px;
  background: var(--bg);
  color: var(--text);
  /* 한글이 예쁘게 나오는 시스템 글꼴 순서. 인터넷 없어도 동작해요. */
  font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
               "Pretendard", "Malgun Gothic", "맑은 고딕", sans-serif;
  -webkit-font-smoothing: antialiased;
  max-width: 420px;      /* 폰 너비 기준. PC에서도 너무 안 퍼지게 */
  margin-inline: auto;   /* 가운데 정렬 */
}

/* ===== 2) 오늘 날짜 영역 ===== */
.today-label {
  font-size: 13px;
  color: var(--muted);
  letter-spacing: 0.02em;
}
/* 날짜와 '오늘로' 버튼을 한 줄에 나란히 */
.date-row {
  display: flex;
  align-items: baseline;   /* 글자 밑선 기준으로 맞춤 */
  gap: 10px;
  margin: 4px 0 28px;
}
.today-date {
  font-size: 30px;
  font-weight: 600;
  line-height: 1.2;
}
/* 지난 날짜를 보고 있을 때만 나타남 */
.today-btn {
  display: none;
  padding: 6px 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
}
.today-btn.show { display: inline-block; }

/* ===== 3) 기분 버튼 5개 (이 앱의 핵심) =====
   flexbox로 한 줄에 나란히 배치 */
.moods {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}
.mood-btn {
  flex: 1;                  /* 5개가 공간을 똑같이 나눠 가짐 */
  aspect-ratio: 1 / 1;      /* 정사각형 유지 */
  border: none;             /* 평소엔 테두리 없음 */
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
  font-size: 24px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  /* 누를 때만 짧게 반응 (불필요한 애니메이션은 안 넣음) */
  transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
}
/* 누를 때 살짝 밝아지는 반응. 크기는 선택 표시에 쓰고 있으니 건드리지 않음 */
.mood-btn:active { filter: brightness(1.25); }

/* ===== 선택 표시 =====
   색만으로 구분하면 브라우저가 색을 건드릴 때 뒤집혀 보일 수 있어요.
   그래서 '크기 + 투명도 + 테두리' 세 가지를 같이 씁니다.
   크기는 어떤 브라우저도 못 바꾸니까 확실한 신호예요. */
.mood-btn {
  opacity: 0.5;
  transform: scale(0.86);            /* 안 고른 건 살짝 작게 */
}
/* 아직 아무것도 안 골랐을 때는 5개 다 똑같이 (고를 게 있다는 신호) */
.moods.none-picked .mood-btn {
  opacity: 1;
  transform: scale(1);
}
.mood-btn.selected {
  opacity: 1;
  transform: scale(1);               /* 고른 것만 원래 크기 = 제일 크게 보임 */
  box-shadow: 0 0 0 2.5px var(--text);
}

/* 키보드 탭으로 이동할 때 위치가 보이게 (접근성) */
.mood-btn:focus-visible,
button:focus-visible {
  outline: 2px solid var(--m5);
  outline-offset: 2px;
}

.status {
  min-height: 20px;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* ===== 한 줄 메모 =====
   기분을 고른 뒤에만 나타남. 평소엔 숨어 있어서 부담이 없어요. */
.memo { display: none; }
.memo.show { display: block; }
.memo input {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: var(--surface);
  color: var(--text);
  font-size: 14px;
  font-family: inherit;   /* 입력칸은 글꼴을 따로 지정해야 본문과 같아져요 */
}
.memo input::placeholder { color: var(--muted); }
.memo input:focus {
  outline: none;
  border-color: var(--m3);
}
.memo-hint {
  font-size: 11px;
  color: var(--muted);
  min-height: 15px;       /* 글자가 없을 때도 높이를 잡아둬서 화면이 안 흔들림 */
  margin-top: 5px;
}

/* ===== 백업 알림 배너 =====
   평소엔 display:none으로 숨어 있고, 조건이 맞으면 .show를 붙여서 보여줌.
   이렇게 '클래스만 갈아끼우기'가 JS로 화면 바꾸는 가장 기본 패턴이에요. */
.banner {
  display: none;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
  margin-bottom: 22px;
  border-radius: 12px;
  /* 기분 5단계의 노란색을 옅게 깔아서 '알림'이라는 걸 표시 */
  background: rgba(217, 169, 74, 0.12);
  border: 1px solid rgba(217, 169, 74, 0.35);
  font-size: 13px;
  line-height: 1.5;
}
.banner.show { display: flex; }
.banner p { margin: 0; flex: 1; }
.banner-btn {
  flex-shrink: 0;               /* 글자가 길어도 버튼이 찌그러지지 않게 */
  padding: 8px 12px;
  border: none;
  border-radius: 8px;
  background: var(--m5);
  color: #221B08;
  font-size: 13px;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
}
.banner-close {
  flex-shrink: 0;
  border: none;
  background: transparent;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
  padding: 4px;
  cursor: pointer;
}

/* ===== 4) 달력 ===== */
.cal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  /* 위쪽 여백을 여기서 잡아둠.
     이웃한 요소끼리 margin은 '합쳐지지 않고 더 큰 값 하나만' 적용돼요(마진 병합).
     덕분에 배너가 있든 없든 달력 위 간격이 32px로 똑같이 유지됩니다. */
  margin-top: 32px;
  margin-bottom: 14px;
}
.cal-title { font-size: 15px; font-weight: 600; }
.nav-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 15px;
  cursor: pointer;
}
.nav-btn:active { background: var(--surface); }

/* CSS Grid로 7열 달력 만들기 (연습한 grid가 여기서 쓰임!) */
.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.dow {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding-bottom: 2px;
}
.cell {
  position: relative;   /* 안에 점을 띄우려면 기준점이 필요해요 */
  aspect-ratio: 1 / 1;
  border-radius: 9px;
  background: var(--surface);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--muted);
}
.cell.empty { background: transparent; }          /* 1일 앞의 빈칸 */
.cell.filled { color: rgba(0,0,0,0.55); font-weight: 600; }
.cell.today { box-shadow: 0 0 0 1.5px var(--text); }

/* 메모가 있는 날 표시.
   ::after는 HTML에 없는 작은 장식을 CSS만으로 덧붙이는 방법이에요.
   currentColor를 쓰면 그 칸 글자색을 그대로 따라가서 배경색과 자동으로 어울려요. */
.cell.has-note::after {
  content: "";
  position: absolute;
  bottom: 5px;
  left: 50%;
  transform: translateX(-50%);
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.75;
}

/* 눌러서 기록할 수 있는 날 (오늘 포함, 미래는 제외) */
.cell.clickable { cursor: pointer; }
/* 지금 고른 날. .today 아래에 써서 둘 다 해당될 때 이 색이 이김 */
.cell.picked { box-shadow: 0 0 0 2px var(--m5); }

/* ===== 5) 맨 아래 백업 영역 ===== */
.footer {
  margin-top: 34px;
  padding-top: 18px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 8px;
}
.text-btn {
  flex: 1;
  padding: 11px 0;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: inherit;
}
.text-btn:active { background: var(--surface); }
.hint { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.6; }

/* 움직임을 줄이는 설정을 켠 사람에겐 애니메이션 끄기 */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

/* ===== 탭 바 =====
   두 버튼이 둥근 박스 안에 들어가고, 고른 탭이 흰 카드처럼 올라오는 방식 */
.tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 28px;
  background: var(--surface);
  border-radius: 13px;
  padding: 4px;
}
.tab {
  flex: 1;
  padding: 9px 0;
  border: none;
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.tab.active {
  background: var(--bg);
  color: var(--text);
  font-weight: 600;
}

/* ===== 그래프 탭 ===== */
.graph-section { margin-bottom: 28px; }
.graph-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 12px;
}
.graph-label { font-size: 15px; font-weight: 600; }
/* 차트를 감싸는 카드 */
.chart-wrap {
  background: var(--surface);
  border-radius: 14px;
  padding: 16px 12px 10px;
  overflow: hidden;
}
/* SVG는 항상 카드 너비에 꽉 차게 */
.chart-wrap svg { display: block; width: 100%; }
/* 기록이 없을 때 메시지 */
.graph-empty {
  font-size: 13px;
  color: var(--muted);
  text-align: center;
  padding: 28px 0;
}
/* 범례: 기분 1~5 색 설명 */
.chart-legend {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
  flex-wrap: wrap;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--muted);
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
</style>
</head>
<body>

  <!-- 탭 바: 기록 / 그래프 전환 -->
  <div class="tabs">
    <button class="tab active" id="tabRecord">기록</button>
    <button class="tab" id="tabGraph">그래프</button>
  </div>

  <!-- 탭 1: 기록 패널 (기존 내용 전부) -->
  <div id="panelRecord">

  <!-- 지금 고른 날짜 -->
  <div class="today-label" id="dateLabel">오늘</div>
  <div class="date-row">
    <div class="today-date" id="todayDate"></div>
    <button class="today-btn" id="todayBtn">오늘로</button>
  </div>

  <!-- 기분 버튼 5개. JS에서 만들어 넣음 -->
  <div class="moods" id="moods"></div>
  <div class="status" id="status"></div>

  <!-- 한 줄 메모. 기분을 고르기 전엔 숨어 있음 -->
  <div class="memo" id="memo">
    <input type="text" id="memoInput" maxlength="80"
           placeholder="오늘 뭐 했는지 한 줄 (안 써도 돼요)">
    <div class="memo-hint" id="memoHint"></div>
  </div>

  <!-- 백업 알림 배너. 처음엔 숨어 있음 -->
  <div class="banner" id="banner">
    <p>오늘이 이번 달 마지막 날이에요. 기록 백업해둘까요?</p>
    <button class="banner-btn" id="bannerBackup">백업</button>
    <button class="banner-close" id="bannerClose" aria-label="닫기">×</button>
  </div>

  <!-- 달력 -->
  <div class="cal-head">
    <button class="nav-btn" id="prevBtn" aria-label="이전 달">‹</button>
    <div class="cal-title" id="calTitle"></div>
    <button class="nav-btn" id="nextBtn" aria-label="다음 달">›</button>
  </div>
  <div class="cal-grid" id="calGrid"></div>

  <!-- 백업 -->
  <div class="footer">
    <button class="text-btn" id="exportBtn">기록 내보내기</button>
    <button class="text-btn" id="importBtn">기록 불러오기</button>
  </div>
  <p class="hint">
    기록은 이 기기 안에만 저장돼요. 브라우저 데이터를 지우면 사라지니
    가끔 내보내기로 백업해두세요.
  </p>

  <!-- 파일 불러오기용. 화면에는 안 보이게 숨김 -->
  <input type="file" id="fileInput" accept=".json" style="display:none">

  </div><!-- #panelRecord 끝 -->

  <!-- 탭 2: 그래프 패널 (처음엔 숨어 있음) -->
  <div id="panelGraph" style="display:none">

    <!-- ① 주간 막대 그래프 -->
    <div class="graph-section">
      <div class="graph-head">
        <button class="nav-btn" id="weekPrevBtn" aria-label="이전 주">‹</button>
        <div class="graph-label" id="weekLabel"></div>
        <button class="nav-btn" id="weekNextBtn" aria-label="다음 주">›</button>
      </div>
      <!-- SVG는 JS가 이 안에 그려 넣음 -->
      <div class="chart-wrap" id="weekChart"></div>
      <div class="chart-legend" id="weekLegend"></div>
    </div>

    <!-- ② 월간 선 그래프 -->
    <div class="graph-section">
      <div class="graph-head">
        <button class="nav-btn" id="monthGraphPrevBtn" aria-label="이전 달">‹</button>
        <div class="graph-label" id="monthGraphLabel"></div>
        <button class="nav-btn" id="monthGraphNextBtn" aria-label="다음 달">›</button>
      </div>
      <div class="chart-wrap" id="monthChart"></div>
      <div class="chart-legend" id="monthLegend"></div>
    </div>

  </div><!-- #panelGraph 끝 -->

<script>
/* =========================================================
   기분 기록 앱 — 자바스크립트
   흐름: 저장소 준비 → 데이터 읽기 → 화면 그리기 → 클릭 처리
   ========================================================= */

/* --- 1) 기분 단계 정의 (배열) ---
   점수 1~5에 이모지와 이름을 붙여둠 */
const MOODS = [
  { score: 1, emoji: "😞", name: "최악" },
  { score: 2, emoji: "🙁", name: "별로" },
  { score: 3, emoji: "😐", name: "보통" },
  { score: 4, emoji: "🙂", name: "좋음" },
  { score: 5, emoji: "😄", name: "최고" },
];

/* --- 2) 저장소 준비 ---
   localStorage = 브라우저가 기기에 남겨두는 작은 저장 공간.
   단, 미리보기 창처럼 막혀 있는 환경도 있어서 try/catch로 감싸고
   실패하면 임시 메모리에라도 담아둡니다. */
const STORE_KEY = "mood-log";          // 기분 기록
const NOTES_KEY = "mood-notes";        // 한 줄 메모 (기분과 따로 보관)
const BACKUP_KEY = "mood-backup-month"; // 마지막으로 백업한 달 ("2026-09" 형태)
let memoryFallback = {};   // localStorage를 못 쓸 때 대신 담을 곳
let storageOK = true;

function loadLog() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    // 저장된 게 없으면 빈 객체로 시작. 있으면 문자열 → 객체로 변환
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    storageOK = false;
    return memoryFallback;
  }
}

function saveLog(log) {
  memoryFallback = log;
  try {
    // 객체는 그대로 못 넣기 때문에 JSON 문자열로 바꿔서 저장
    localStorage.setItem(STORE_KEY, JSON.stringify(log));
  } catch (e) {
    storageOK = false;
  }
}

/* 메모도 같은 방식으로 읽고 쓰기. 기분 점수와 저장 칸을 따로 둔 이유는
   기존 기록을 건드리지 않아도 되기 때문이에요. */
function loadNotes() {
  try {
    const raw = localStorage.getItem(NOTES_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}

function saveNotes() {
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  } catch (e) {
    storageOK = false;
  }
}

/* --- 3) 전체 데이터 ---
   모양: { "2026-09-14": 4, "2026-09-13": 2 }  (날짜: 점수) */
let log = loadLog();

/* 메모. 모양: { "2026-09-14": "회의 길었음" } */
let notes = loadNotes();

/* 달력이 지금 몇 년 몇 월을 보고 있는지 기억하는 변수 */
let viewYear, viewMonth;

/* --- 4) 날짜를 "2026-09-14" 모양 문자열로 만드는 함수 ---
   padStart(2, "0") → 9월을 "09"로 맞춰줌 */
function toKey(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0"); // 월은 0부터 시작!
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}

const today = new Date();
const todayKey = toKey(today);

/* --- 5) 지금 기록 대상이 되는 날짜 ---
   기본값은 오늘. 달력 칸을 누르면 그 날짜로 바뀝니다. */
let selectedKey = todayKey;

/* "2026-09-13" → "9월 13일 일요일" 로 바꿔주는 도우미 함수 */
function labelOf(key) {
  const dows = ["일", "월", "화", "수", "목", "금", "토"];
  const parts = key.split("-").map(Number);          // ["2026","09","13"] → [2026,9,13]
  const date = new Date(parts[0], parts[1] - 1, parts[2]);
  return `${parts[1]}월 ${parts[2]}일 ${dows[date.getDay()]}요일`;
}

/* --- 5-2) 화면 맨 위 날짜 영역 그리기 --- */
function renderHeader() {
  const isToday = selectedKey === todayKey;
  document.getElementById("dateLabel").textContent = isToday ? "오늘" : "지난 기록";
  document.getElementById("todayDate").textContent = labelOf(selectedKey);
  // 지난 날짜일 때만 '오늘로' 버튼 보이기
  document.getElementById("todayBtn").classList.toggle("show", !isToday);
}

/* --- 6) 기분 버튼 5개 만들기 --- */
function renderMoodButtons() {
  const box = document.getElementById("moods");
  box.innerHTML = "";   // 다시 그릴 때를 위해 먼저 비움

  // 이 날짜에 아직 기록이 없으면 5개 모두 또렷하게 보여줌
  box.classList.toggle("none-picked", !log[selectedKey]);

  // 배열을 하나씩 돌면서 버튼을 만들어 붙임 (반복문 복습!)
  MOODS.forEach(function (mood) {
    const btn = document.createElement("button");
    btn.className = "mood-btn";
    btn.textContent = mood.emoji;
    btn.setAttribute("aria-label", mood.name);   // 화면 읽기 도구용 이름
    btn.style.background = `var(--m${mood.score})`;

    // 지금 고른 날짜에 이미 기록된 점수면 표시해두기
    if (log[selectedKey] === mood.score) {
      btn.classList.add("selected");
    }

    // 클릭하면 바로 저장 (확인 버튼 없음 = 3초 컷)
    btn.addEventListener("click", function () {
      flushNote();           // 쓰던 메모가 있으면 먼저 저장
      log[selectedKey] = mood.score;
      saveLog(log);
      renderMoodButtons();   // 선택 표시 갱신
      renderMemo();          // 메모 입력칸 나타나게
      renderCalendar();      // 달력에도 바로 반영
      const when = selectedKey === todayKey ? "오늘은" : labelOf(selectedKey) + "을";
      showStatus(`${when} "${mood.name}"으로 저장했어요.`);
      checkBackupBanner();   // 기록한 직후에 백업할 때가 됐는지 확인
    });

    box.appendChild(btn);
  });
}

/* --- 7) 아래 안내 문구 --- */
function showStatus(message) {
  const el = document.getElementById("status");
  if (!storageOK) {
    el.textContent = "이 환경에서는 저장이 막혀 있어요. 폰이나 실제 주소에서 열면 저장됩니다.";
    return;
  }
  if (message) {          // 방금 저장했다는 안내가 있으면 그걸 그대로 보여줌
    el.textContent = message;
    return;
  }
  const score = log[selectedKey];
  const when = selectedKey === todayKey ? "오늘" : labelOf(selectedKey);
  el.textContent = score
    ? `${when} "${MOODS[score - 1].name}"으로 기록됨. 다시 누르면 바뀌어요.`
    : `${when} 기분을 하나 골라주세요.`;
}

/* --- 7-1) 한 줄 메모 ---
   기분이 기록된 날에만 입력칸을 보여주고, 저장된 메모가 있으면 채워 넣음 */
function renderMemo() {
  const box = document.getElementById("memo");
  const input = document.getElementById("memoInput");
  const hasMood = Boolean(log[selectedKey]);

  box.classList.toggle("show", hasMood);
  input.value = hasMood ? (notes[selectedKey] || "") : "";
  document.getElementById("memoHint").textContent = "";
}

/* 타이핑할 때마다 저장하면 너무 잦으니, 손을 멈춘 뒤 0.6초에 한 번만 저장.
   이런 '기다렸다 한 번만 실행' 방식을 디바운스(debounce)라고 불러요. */
let noteTimer = null;

function saveNoteNow() {
  const input = document.getElementById("memoInput");
  const text = input.value.trim();

  if (text) {
    notes[selectedKey] = text;
  } else {
    delete notes[selectedKey];   // 빈칸이면 아예 지움 (빈 문자열을 남기지 않게)
  }
  saveNotes();
  document.getElementById("memoHint").textContent = text ? "메모 저장됨" : "";
  renderCalendar();   // 점이 바로 나타나거나 사라지게 달력 다시 그리기
}

/* 날짜를 옮기거나 기분을 다시 고르기 전에, 아직 저장 안 된 글자를 먼저 저장 */
function flushNote() {
  if (noteTimer) {
    clearTimeout(noteTimer);
    noteTimer = null;
    saveNoteNow();
  }
}

document.getElementById("memoInput").addEventListener("input", function () {
  clearTimeout(noteTimer);                    // 이전 예약 취소
  noteTimer = setTimeout(function () {
    noteTimer = null;
    saveNoteNow();
  }, 600);
});

/* 입력칸에서 빠져나갈 때는 기다리지 않고 바로 저장 */
document.getElementById("memoInput").addEventListener("blur", flushNote);

/* 엔터를 누르면 키보드 내려가게 (폰에서 편함) */
document.getElementById("memoInput").addEventListener("keydown", function (e) {
  if (e.key === "Enter") this.blur();
});

/* --- 7-2) 오늘이 이번 달 마지막 날인지 확인 ---
   "다음 달 0일"이 그 달의 마지막 날짜예요. 달력 그릴 때 쓴 요령과 같습니다.
   오늘 날짜가 그 숫자와 같으면 = 마지막 날. */
function isLastDayOfMonth() {
  const lastDate = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
  return today.getDate() === lastDate;
}

/* 이번 달을 "2026-09" 모양으로 (백업했는지 비교할 때 씀) */
function thisMonthKey() {
  return todayKey.slice(0, 7);   // "2026-09-14" 앞 7글자만 자르기
}

/* 이번 달에 이미 백업했는지 */
function alreadyBackedUp() {
  try {
    return localStorage.getItem(BACKUP_KEY) === thisMonthKey();
  } catch (e) {
    return false;
  }
}

/* --- 7-3) 배너를 띄울지 결정 ---
   조건 세 개를 모두 만족해야 뜹니다:
   오늘이 마지막 날 / 이번 달 백업 아직 안 함 / 기록이 하나라도 있음 */
function checkBackupBanner() {
  const banner = document.getElementById("banner");
  const shouldShow =
    isLastDayOfMonth() &&
    !alreadyBackedUp() &&
    Object.keys(log).length > 0;

  banner.classList.toggle("show", shouldShow);   // true면 붙이고 false면 떼기
}

/* --- 8) 달력 그리기 (이 앱에서 제일 재밌는 부분) --- */
function renderCalendar() {
  document.getElementById("calTitle").textContent = `${viewYear}년 ${viewMonth + 1}월`;

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  // (1) 요일 머리글 7개
  ["일", "월", "화", "수", "목", "금", "토"].forEach(function (d) {
    const el = document.createElement("div");
    el.className = "dow";
    el.textContent = d;
    grid.appendChild(el);
  });

  // (2) 이번 달 1일이 무슨 요일인지 → 그만큼 빈칸을 먼저 넣어야 줄이 맞음
  const firstDay = new Date(viewYear, viewMonth, 1).getDay();  // 0=일요일
  for (let i = 0; i < firstDay; i++) {
    const el = document.createElement("div");
    el.className = "cell empty";
    grid.appendChild(el);
  }

  // (3) 이번 달 날짜 수 구하기
  //     "다음 달 0일" = 이번 달 마지막 날. 자주 쓰는 요령이에요.
  const lastDate = new Date(viewYear, viewMonth + 1, 0).getDate();

  for (let day = 1; day <= lastDate; day++) {
    const key = toKey(new Date(viewYear, viewMonth, day));
    const score = log[key];          // 기록이 없으면 undefined

    const el = document.createElement("div");
    el.className = "cell";
    el.textContent = day;

    if (score) {
      el.classList.add("filled");
      el.style.background = `var(--m${score})`;   // 점수에 맞는 색으로 칠하기
      el.title = `${viewMonth + 1}월 ${day}일 · ${MOODS[score - 1].name}`
        + (notes[key] ? ` · ${notes[key]}` : "");
    }
    if (notes[key]) el.classList.add("has-note");   // 메모 있는 날에 점 찍기
    if (key === todayKey) el.classList.add("today");
    if (key === selectedKey) el.classList.add("picked");

    /* 오늘까지만 누를 수 있게. 미래 기분은 기록할 게 없으니까요.
       날짜가 "2026-09-13" 형태라서 문자열끼리 비교해도 순서가 정확히 맞아요. */
    if (key <= todayKey) {
      el.classList.add("clickable");
      el.addEventListener("click", function () {
        flushNote();           // 날짜 옮기기 전에 쓰던 메모 저장
        selectedKey = key;     // 기록 대상을 이 날짜로 바꿈
        renderHeader();
        renderMoodButtons();
        renderMemo();          // 그날 메모가 있으면 입력칸에 채워줌
        renderCalendar();
        showStatus();
        // 폰에서는 버튼이 화면 위에 있으니 위로 올려줌
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    }

    grid.appendChild(el);
  }
}

/* --- 9) 달 넘기기 버튼 --- */
document.getElementById("prevBtn").addEventListener("click", function () {
  viewMonth--;
  if (viewMonth < 0) { viewMonth = 11; viewYear--; }   // 1월에서 뒤로 가면 작년 12월
  renderCalendar();
});
document.getElementById("nextBtn").addEventListener("click", function () {
  viewMonth++;
  if (viewMonth > 11) { viewMonth = 0; viewYear++; }
  renderCalendar();
});

/* --- 9-2) '오늘로' 버튼: 기록 대상을 오늘로 되돌리고 달력도 이번 달로 --- */
document.getElementById("todayBtn").addEventListener("click", function () {
  flushNote();
  selectedKey = todayKey;
  viewYear = today.getFullYear();
  viewMonth = today.getMonth();
  renderHeader();
  renderMoodButtons();
  renderMemo();
  renderCalendar();
  showStatus();
});

/* --- 10) 백업: 기록을 파일로 내보내기 --- */
/* 아래 백업 버튼과 배너의 백업 버튼이 똑같은 일을 하므로
   함수로 한 번만 만들어두고 두 곳에서 불러 씁니다. */
function exportLog() {
  flushNote();   // 쓰다 만 메모까지 포함시키기

  /* 백업 파일 모양이 바뀌었어요.
     예전: { "2026-09-14": 4 }
     지금: { "version": 2, "moods": {...}, "notes": {...} }
     version을 적어두면 나중에 형식이 또 바뀌어도 구분할 수 있어요. */
  const payload = { version: 2, moods: log, notes: notes };
  const text = JSON.stringify(payload, null, 2);        // 보기 좋게 줄바꿈 포함
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);

  // 눈에 안 보이는 링크를 만들어 클릭시키는 방식 (파일 저장 기본 패턴)
  const a = document.createElement("a");
  a.href = url;
  a.download = `기분기록-${todayKey}.json`;
  a.click();
  URL.revokeObjectURL(url);

  // "이번 달은 백업했다"고 적어두기 → 같은 달엔 배너가 다시 안 뜸
  try {
    localStorage.setItem(BACKUP_KEY, thisMonthKey());
  } catch (e) { /* 저장이 막힌 환경이면 그냥 넘어감 */ }

  document.getElementById("banner").classList.remove("show");
}

document.getElementById("exportBtn").addEventListener("click", exportLog);
document.getElementById("bannerBackup").addEventListener("click", exportLog);

/* 배너의 × 버튼: 이번엔 그냥 닫기. 백업 기록은 남기지 않으니
   다음에 기록을 누르면 (아직 마지막 날이면) 또 뜹니다. */
document.getElementById("bannerClose").addEventListener("click", function () {
  document.getElementById("banner").classList.remove("show");
});

/* --- 11) 백업: 파일에서 기록 불러오기 --- */
document.getElementById("importBtn").addEventListener("click", function () {
  document.getElementById("fileInput").click();
});
document.getElementById("fileInput").addEventListener("change", function (event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function () {
    try {
      const incoming = JSON.parse(reader.result);

      /* 예전 백업 파일과 새 파일 둘 다 읽을 수 있게 처리.
         moods 칸이 있으면 새 형식, 없으면 옛 형식(날짜:점수만 들어있는 파일)이에요. */
      const incomingMoods = incoming.moods ? incoming.moods : incoming;
      const incomingNotes = incoming.notes ? incoming.notes : {};

      // 기존 기록 위에 덮어쓰기 (같은 날짜는 불러온 값이 이김)
      log = Object.assign({}, log, incomingMoods);
      notes = Object.assign({}, notes, incomingNotes);
      saveLog(log);
      saveNotes();
      renderMoodButtons();
      renderMemo();
      renderCalendar();
      showStatus("기록을 불러왔어요.");
    } catch (e) {
      showStatus("파일을 읽지 못했어요. 내보내기로 만든 json 파일인지 확인해주세요.");
    }
  };
  reader.readAsText(file);
});

/* --- 12) 앱 시작 ---
   여기가 실행 순서의 출발점입니다. */
viewYear = today.getFullYear();
viewMonth = today.getMonth();

renderHeader();
renderMoodButtons();
renderMemo();
renderCalendar();
showStatus();

/* =========================================================
   그래프 섹션
   ========================================================= */

/* 기분 색상 배열. CSS 변수를 직접 못 쓰는 SVG를 위해 실제 HEX 값으로 */
const MOOD_HEX = ["#3D4457", "#4E6E82", "#6F9080", "#A8A45E", "#D9A94A"];

/* --- G1) 그래프 탭 상태 변수 --- */

/* 주간 차트용: 현재 보고 있는 주의 월요일 */
let graphWeekOf = getMondayOf(today);

/* 월간 차트용: 현재 보고 있는 연/월 */
let graphYear  = today.getFullYear();
let graphMonth = today.getMonth();

/* 어떤 날짜가 속한 주의 월요일을 반환 (한국은 월요일 시작) */
function getMondayOf(date) {
  const d = new Date(date);
  d.setHours(0, 0, 0, 0);
  /* getDay(): 0=일, 1=월, ..., 6=토
     일요일은 -6, 월요일은 0, 화요일은 -1... */
  const diff = d.getDay() === 0 ? -6 : 1 - d.getDay();
  d.setDate(d.getDate() + diff);
  return d;
}

/* --- G2) 범례 만들기 ---
   기분 5단계 색 설명을 차트 아래에 표시 */
function renderLegend(containerId) {
  const el = document.getElementById(containerId);
  el.innerHTML = MOODS.map(function (m) {
    return `<span class="legend-item">
      <span class="legend-dot" style="background:${MOOD_HEX[m.score - 1]}"></span>
      ${m.name}
    </span>`;
  }).join("");
}

/* --- G3) 주간 막대 그래프 ---
   이번 주 월~일을 막대로 그림. 기록이 있는 날은 기분 색, 없는 날은 흐린 선 */
function renderWeeklyBar() {
  /* 이번 주 7일의 날짜 객체를 만들어둠 */
  const days = [];
  for (let i = 0; i < 7; i++) {
    const d = new Date(graphWeekOf);
    d.setDate(d.getDate() + i);
    days.push(d);
  }

  /* 주 범위 레이블 (예: "9월 15–21일", 달이 바뀌면 "9월 29일 – 10월 5일") */
  const s = days[0], e = days[6];
  document.getElementById("weekLabel").textContent =
    s.getMonth() === e.getMonth()
      ? `${s.getMonth() + 1}월 ${s.getDate()}–${e.getDate()}일`
      : `${s.getMonth() + 1}월 ${s.getDate()}일 – ${e.getMonth() + 1}월 ${e.getDate()}일`;

  /* SVG 치수 설정 */
  const W = 356, H = 190;
  const padL = 6, padR = 6, padT = 12, padB = 40;
  const plotH = H - padT - padB;
  const colW  = (W - padL - padR) / 7;
  const barW  = colW * 0.62;
  const DOW   = ["월", "화", "수", "목", "금", "토", "일"];

  /* 가이드 라인: y축의 각 점수 위치에 옅은 선 */
  let grid = "";
  for (let s = 1; s <= 5; s++) {
    const y = padT + plotH - (s / 5) * plotH;
    grid += `<line x1="${padL}" y1="${y}" x2="${W - padR}" y2="${y}"
      stroke="#2C2F36" stroke-width="1"/>`;
  }

  let bars = "", dayLabels = "";
  let hasAny = false;

  days.forEach(function (d, i) {
    const key   = toKey(d);
    const score = log[key];
    const cx    = padL + (i + 0.5) * colW;
    const bx    = cx - barW / 2;
    const isFuture = key > todayKey;
    const isToday  = key === todayKey;

    if (score) {
      hasAny = true;
      const barH = (score / 5) * plotH;
      const by   = padT + plotH - barH;
      /* 막대 위에 이모지를 띄워 한눈에 기분이 보이게 */
      bars += `<rect x="${bx}" y="${by}" width="${barW}" height="${barH}"
        rx="5" fill="${MOOD_HEX[score - 1]}" opacity="0.9"/>
      <text x="${cx}" y="${by - 4}" text-anchor="middle"
        font-size="14" dominant-baseline="auto">${MOODS[score - 1].emoji}</text>`;
    } else if (!isFuture) {
      /* 기록 없는 지난 날: 바닥에 흐린 바 */
      bars += `<rect x="${bx}" y="${padT + plotH - 3}" width="${barW}"
        height="3" rx="2" fill="#2C2F36"/>`;
    }

    /* 요일 + 날짜 레이블 */
    const col = isFuture ? "#3A3D45"
              : isToday  ? "#ECEAE4"
              :             "#868A93";
    dayLabels += `
      <text x="${cx}" y="${H - 20}" text-anchor="middle"
        fill="${col}" font-size="12" font-weight="${isToday ? 700 : 400}">${DOW[i]}</text>
      <text x="${cx}" y="${H - 6}" text-anchor="middle"
        fill="${col}" font-size="10" opacity="0.7">${d.getDate()}</text>`;
  });

  if (!hasAny) {
    document.getElementById("weekChart").innerHTML =
      `<div class="graph-empty">이번 주 기록이 없어요</div>`;
    return;
  }

  document.getElementById("weekChart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${grid}${bars}${dayLabels}
    </svg>`;
}

/* --- G4) 월간 선 그래프 ---
   이번 달 매일을 점으로 찍고 선으로 잇습니다.
   기록이 없는 날은 건너뛰고, 선은 연속된 점만 연결해요. */
function renderMonthlyLine() {
  const lastDate = new Date(graphYear, graphMonth + 1, 0).getDate();
  document.getElementById("monthGraphLabel").textContent =
    `${graphYear}년 ${graphMonth + 1}월`;

  const W = 356, H = 190;
  const padL = 18, padR = 14, padT = 16, padB = 30;
  const plotW = W - padL - padR;
  const plotH = H - padT - padB;

  /* 이번 달 기록이 있는 날 목록을 만들어둠 */
  const points = [];
  for (let day = 1; day <= lastDate; day++) {
    const key = toKey(new Date(graphYear, graphMonth, day));
    const score = log[key];
    if (score) {
      /* x: 1일은 맨 왼쪽, lastDate일은 맨 오른쪽 */
      const x = padL + ((day - 1) / Math.max(lastDate - 1, 1)) * plotW;
      /* y: 1점이 아래, 5점이 위. (score-1)/4로 0~1 범위를 만들고 반전 */
      const y = padT + plotH - ((score - 1) / 4) * plotH;
      points.push({ x, y, score, day, key });
    }
  }

  if (points.length === 0) {
    document.getElementById("monthChart").innerHTML =
      `<div class="graph-empty">이번 달 기록이 없어요</div>`;
    return;
  }

  /* y축 가이드 라인 + 점수 레이블 */
  let grid = "";
  const scoreNames = ["", "최악", "별로", "보통", "좋음", "최고"];
  for (let sc = 1; sc <= 5; sc++) {
    const y = padT + plotH - ((sc - 1) / 4) * plotH;
    grid += `<line x1="${padL - 4}" y1="${y}" x2="${W - padR}" y2="${y}"
      stroke="#2C2F36" stroke-width="1"/>
    <text x="${padL - 6}" y="${y}" text-anchor="end" dominant-baseline="middle"
      fill="#3A3D45" font-size="9">${scoreNames[sc]}</text>`;
  }

  /* 점수가 변하는 구간마다 선 색을 그라데이션처럼 바꾸기 위해
     세그먼트 단위로 선을 그음. 두 점 사이의 색은 두 점 색의 중간값 사용. */
  let lines = "";
  for (let i = 0; i < points.length - 1; i++) {
    const a = points[i], b = points[i + 1];
    /* 날짜가 너무 멀리 떨어진 구간(8일 이상)엔 선을 안 그음.
       기록이 한참 비어있는 구간을 연결하면 오해할 수 있어요. */
    if (b.day - a.day <= 7) {
      lines += `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
        stroke="${MOOD_HEX[a.score - 1]}" stroke-width="2"
        stroke-linecap="round" opacity="0.7"/>`;
    }
  }

  /* 각 점 + 호버 시 날짜 보여주기 */
  let dots = "";
  points.forEach(function (p) {
    dots += `<circle cx="${p.x}" cy="${p.y}" r="5"
      fill="${MOOD_HEX[p.score - 1]}" stroke="#16171B" stroke-width="2">
      <title>${graphMonth + 1}월 ${p.day}일 · ${MOODS[p.score - 1].name}</title>
    </circle>`;
  });

  /* x축 날짜 레이블: 1일, 5의 배수, 마지막 날만 표시해서 너무 안 빽빽하게 */
  let xLabels = "";
  for (let day = 1; day <= lastDate; day++) {
    if (day === 1 || day % 5 === 0 || day === lastDate) {
      const x = padL + ((day - 1) / Math.max(lastDate - 1, 1)) * plotW;
      xLabels += `<text x="${x}" y="${H - 6}" text-anchor="middle"
        fill="#868A93" font-size="10">${day}</text>`;
    }
  }

  document.getElementById("monthChart").innerHTML =
    `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
      ${grid}${lines}${dots}${xLabels}
    </svg>`;
}

/* --- G5) 그래프 탭에 들어올 때 둘 다 한번에 그리기 --- */
function renderGraphs() {
  renderWeeklyBar();
  renderMonthlyLine();
  renderLegend("weekLegend");
  renderLegend("monthLegend");
}

/* --- G6) 주간 차트 내비게이션 --- */
document.getElementById("weekPrevBtn").addEventListener("click", function () {
  graphWeekOf.setDate(graphWeekOf.getDate() - 7);
  renderWeeklyBar();
});
document.getElementById("weekNextBtn").addEventListener("click", function () {
  const next = new Date(graphWeekOf);
  next.setDate(next.getDate() + 7);
  /* 미래 주는 안 보이게 막음 */
  if (next <= getMondayOf(today)) {
    graphWeekOf = next;
    renderWeeklyBar();
  }
});

/* --- G7) 월간 차트 내비게이션 --- */
document.getElementById("monthGraphPrevBtn").addEventListener("click", function () {
  graphMonth--;
  if (graphMonth < 0) { graphMonth = 11; graphYear--; }
  renderMonthlyLine();
});
document.getElementById("monthGraphNextBtn").addEventListener("click", function () {
  /* 현재 달 이후는 막음 */
  if (graphYear < today.getFullYear() ||
      (graphYear === today.getFullYear() && graphMonth < today.getMonth())) {
    graphMonth++;
    if (graphMonth > 11) { graphMonth = 0; graphYear++; }
    renderMonthlyLine();
  }
});

/* --- G8) 탭 전환 ---
   탭 버튼을 누르면 해당 패널만 보이고 나머지는 숨김.
   이게 싱글 페이지 앱(SPA)의 제일 간단한 형태예요. */
document.getElementById("tabRecord").addEventListener("click", function () {
  this.classList.add("active");
  document.getElementById("tabGraph").classList.remove("active");
  document.getElementById("panelRecord").style.display = "";
  document.getElementById("panelGraph").style.display = "none";
});
document.getElementById("tabGraph").addEventListener("click", function () {
  this.classList.add("active");
  document.getElementById("tabRecord").classList.remove("active");
  document.getElementById("panelRecord").style.display = "none";
  document.getElementById("panelGraph").style.display = "";
  /* 그래프 탭에 들어올 때마다 최신 데이터로 다시 그림 */
  renderGraphs();
});
</script>
